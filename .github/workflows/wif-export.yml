name: wif-export
on:
  workflow_dispatch:

permissions:
  id-token: write # REQUIRED — lets GitHub mint the OIDC token
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: Mint the OIDC token cleanly using GitHub's core JS library
      - name: Fetch OIDC Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('descope');
            core.setOutput('token', token);

      # Step 2: Export snapshot via WIF
      - name: Export snapshot via WIF
        env:
          DESCOPE_BASE_URL: ${{ vars.DESCOPE_BASE_URL }}
          PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
          GH_JWT: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          
          # Use env vars directly in curl to avoid payload injection issues
          CODE=$(curl -sS -o snapshot.json -w '%{http_code}' \
            -X POST "${DESCOPE_BASE_URL}/v1/mgmt/project/snapshot/export" \
            -H "Authorization: Bearer ${PROJECT_ID}:${GH_JWT}" \
            -H "Content-Type: application/json" \
            -d '{}')
            
          echo "POST /v1/mgmt/project/snapshot/export -> HTTP $CODE"
          head -c 500 snapshot.json; echo
          
          if [ "$CODE" != "200" ]; then
            echo "Export failed with HTTP status $CODE"
            exit 1
          fi
          
          echo "WIF snapshot export succeeded ($(wc -c < snapshot.json) bytes)"