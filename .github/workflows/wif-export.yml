# Export a project snapshot using Workload Identity Federation.
#
# Proves the CLI can authenticate to the Management API with the short-lived OIDC token this
# job requests for itself, instead of a stored management key. Nothing secret is configured:
# management_key here is the key *id*, which is an identifier.
#
# The export action requests the token itself, for the audience `<descope_base_url>/<key id>`,
# and passes it to the CLI as DESCOPE_MANAGEMENT_KEY. The CLI sends `Bearer <projectId>:<jwt>`
# and the Management API reads the key id back out of the verified audience.
#
# Before it can succeed, on the Descope side:
#   - the management key must be federated to the GitHub issuer
#     (https://token.actions.githubusercontent.com) with claim filters matching this repo
#   - the target environment must be running the WIF backend (descope/backend#2038)
#   - that environment's DESCOPE_API_BASE_URL must equal descope_base_url below, since the
#     audience is derived from it and a mismatch is a silent 401

name: wif-export

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  # REQUIRED - without this GitHub will not mint an OIDC token for the job and the action fails
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # the export action writes the snapshot into the working tree and diffs it, so it needs a checkout
      - uses: actions/checkout@v4

      - name: Export Snapshot
        id: export
        uses: descope/descopecli/.github/actions/export@3a191cd55a8004107c3be66346c4f078bda521cb
        with:
          # the project to export from
          project_id: P3IfmhXacLB2jfrzai62ymhgKJCH

          # the id of the management key to assume, not its secret
          management_key: K3Ja5lQE1ctzC9QlzL3F2fAux1RK
          use_oidc: true

          # where the CLI sends the request, and what the token audience is derived from
          descope_base_url: https://api.descope.org

          files_path: ./descope_export

          # build the CLI from the same branch as the action, so both sides agree on the credential
          descopecli_version: 3a191cd55a8004107c3be66346c4f078bda521cb

      - name: Show the exported snapshot
        run: |
          echo "Export completed, files written:"
          find ./descope_export -type f | head -20

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-snapshot
          path: ./descope_export
          if-no-files-found: ignore
