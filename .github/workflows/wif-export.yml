# Export a Descope project snapshot authenticating with this job's OWN GitHub OIDC
# token. No management key secret is stored anywhere in this repository.
#
# The credential is `<projectId>:<jwt>:<keyId>` — the Management API's existing
# three-part `projectID:JWT:AccessKey` authorization form. The workload NAMES the
# management key it acts as (the way sts:AssumeRoleWithWebIdentity requires a
# RoleArn), and the request is authorized with that key's own roles. So the claim
# filters on the Descope side are a guard on whether this token may use the key,
# not a selector for which key it gets.
#
# This calls the REST endpoint directly instead of using descopecli, because the
# CLI does not yet send the three-part credential. Once it does, this whole step
# collapses back to `uses: descope/descopecli/.github/actions/export`.
#
# ---------------------------------------------------------------------------
# SETUP — every value here is NON-SECRET, so use repository *variables*
# (Settings -> Secrets and variables -> Actions -> Variables), not secrets:
#
#   DESCOPE_BASE_URL       the API host, e.g. https://davidb.descope.team
#   PRODUCTION_PROJECT_ID  the project to export
#   DESCOPE_KEY_ID         the management key ID this token acts as (K2...)
#
# The OIDC audience is hardcoded below to https://api.descope.com.
#
# On the Descope side, add a trusted issuer bound to that management key:
#   issuer   https://token.actions.githubusercontent.com
#   key      the same DESCOPE_KEY_ID
#   sub      repo:davidbemer/wif-snapshot-export:ref:refs/heads/main
#   aud      https://api.descope.com
#   max token lifetime   at least 60 seconds (mandatory; 0 is rejected)
#
# The environment must be running the WIF backend branch with the feature flag on.
# GitHub-hosted runners cannot reach localhost, so a local stack needs a tunnel.
# ---------------------------------------------------------------------------
name: wif-export

on:
  workflow_dispatch:

permissions:
  # REQUIRED. Without it core.getIDToken() has no OIDC endpoint to call.
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: mint
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://localhost:8443');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Export snapshot with a GitHub-minted OIDC token
        env:
          BASE_URL: ${{ vars.DESCOPE_BASE_URL }}
          PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
          KEY_ID: ${{ vars.DESCOPE_KEY_ID }}
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail

          : "${BASE_URL:?set the DESCOPE_BASE_URL repository variable}"
          : "${PROJECT_ID:?set the PRODUCTION_PROJECT_ID repository variable}"
          : "${KEY_ID:?set the DESCOPE_KEY_ID repository variable}"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi

          # Print the subject this token carries. It is this workflow's own
          # identity, not a secret, and it is the one thing you need in order to
          # fix an allowed-subject pattern that does not match.
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "token sub: $(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.sub' || echo '<undecodable>')"
          echo "token aud: $(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.aud' || echo '<undecodable>')"

          # Export, naming the management key in the credential.
          echo "POST $BASE_URL/v1/mgmt/project/snapshot/export"
          HTTP_CODE="$(curl -sS -o snapshot.json -w '%{http_code}' \
            -X POST "$BASE_URL/v1/mgmt/project/snapshot/export" \
            -H "Authorization: Bearer $PROJECT_ID:$TOKEN:$KEY_ID" \
            -H "Content-Type: application/json" \
            -d '{}')"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Export failed with HTTP $HTTP_CODE"
            # The body carries the reason. A 401 is an authentication or claim-filter
            # rejection; a 5xx means the issuer's metadata or JWKS could not be
            # fetched, which is retryable and NOT a bad credential.
            cat snapshot.json || true
            exit 1
          fi

          jq -r '"exported \(.files | length) files"' snapshot.json

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-snapshot
          path: snapshot.json
          if-no-files-found: warn
